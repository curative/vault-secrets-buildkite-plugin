name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  token-not-in-docker-argv:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check the Vault token never appears in docker's argv
        run: ./tests/token_not_in_docker_argv.sh
